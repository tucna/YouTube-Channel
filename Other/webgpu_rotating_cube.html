<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Rotating Cube</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- gl-matrix for 3D math operations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/3.4.2/gl-matrix-min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; }
        #gpuCanvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body class="text-slate-200">

    <!-- Container for Canvas -->
    <div class="relative w-full h-full">
        <canvas id="gpuCanvas"></canvas>
        
        <!-- UI Overlay -->
        <div class="absolute top-4 left-4 pointer-events-none">
            <h1 class="text-2xl font-bold tracking-tight text-white drop-shadow-md">WebGPU Rotating Cube</h1>
            <p class="text-sm text-slate-400 mt-1">Rendered using native WebGPU and WGSL shaders</p>
        </div>

        <!-- Unsupported Error Message (Hidden by default) -->
        <div id="errorMessage" class="hidden absolute inset-0 flex items-center justify-center bg-slate-900/90 backdrop-blur-sm z-50">
            <div class="max-w-md p-6 bg-slate-800 rounded-xl shadow-2xl border border-slate-700 text-center">
                <svg class="w-12 h-12 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <h2 class="text-xl font-semibold text-white mb-2">WebGPU Not Supported</h2>
                <p class="text-slate-300 text-sm">
                    Your browser does not appear to support WebGPU. Please ensure you are using a recent version of Chrome, Edge, or Safari with WebGPU enabled.
                </p>
            </div>
        </div>
    </div>

    <!-- WebGPU Logic -->
    <script>
        // WGSL Shader Code
        const wgslShaders = `
            struct Uniforms {
                mvpMatrix : mat4x4<f32>,
            };
            @binding(0) @group(0) var<uniform> uniforms : Uniforms;

            struct VertexOutput {
                @builtin(position) Position : vec4<f32>,
                @location(0) fragColor : vec4<f32>,
            };

            @vertex
            fn vs_main(
                @location(0) position : vec4<f32>,
                @location(1) color : vec4<f32>
            ) -> VertexOutput {
                var output : VertexOutput;
                // Apply MVP matrix to the position
                output.Position = uniforms.mvpMatrix * position;
                // Pass color to the fragment shader
                output.fragColor = color;
                return output;
            }

            @fragment
            fn fs_main(@location(0) fragColor : vec4<f32>) -> @location(0) vec4<f32> {
                return fragColor;
            }
        `;

        // Cube Vertex Data: x, y, z, w,  r, g, b, a
        const vertexData = new Float32Array([
            // Front face vertices
            -1, -1,  1, 1,   1, 0, 0, 1, // 0: bottom-left (red)
             1, -1,  1, 1,   0, 1, 0, 1, // 1: bottom-right (green)
             1,  1,  1, 1,   0, 0, 1, 1, // 2: top-right (blue)
            -1,  1,  1, 1,   1, 1, 0, 1, // 3: top-left (yellow)
            
            // Back face vertices
            -1, -1, -1, 1,   1, 0, 1, 1, // 4: bottom-left (magenta)
             1, -1, -1, 1,   0, 1, 1, 1, // 5: bottom-right (cyan)
             1,  1, -1, 1,   1, 1, 1, 1, // 6: top-right (white)
            -1,  1, -1, 1,   0, 0, 0, 1, // 7: top-left (black)
        ]);

        // Cube Index Data (using triangle lists)
        const indexData = new Uint16Array([
            0, 1, 2,  0, 2, 3, // front
            1, 5, 6,  1, 6, 2, // right
            5, 4, 7,  5, 7, 6, // back
            4, 0, 3,  4, 3, 7, // left
            3, 2, 6,  3, 6, 7, // top
            4, 5, 1,  4, 1, 0  // bottom
        ]);

        async function initWebGPU() {
            const canvas = document.getElementById('gpuCanvas');
            const errorDiv = document.getElementById('errorMessage');

            // 1. Check for WebGPU Support
            if (!navigator.gpu) {
                errorDiv.classList.remove('hidden');
                return;
            }

            // 2. Request Adapter and Device
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) {
                errorDiv.classList.remove('hidden');
                return;
            }
            const device = await adapter.requestDevice();

            // 3. Configure Canvas Context
            const context = canvas.getContext('webgpu');
            const presentationFormat = navigator.gpu.getPreferredCanvasFormat();
            context.configure({
                device,
                format: presentationFormat,
                alphaMode: 'premultiplied',
            });

            // 4. Create Shader Module
            const shaderModule = device.createShaderModule({ code: wgslShaders });

            // 5. Create Render Pipeline
            const pipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: {
                    module: shaderModule,
                    entryPoint: 'vs_main',
                    buffers: [{
                        arrayStride: 32, // 8 floats * 4 bytes
                        attributes: [
                            { shaderLocation: 0, offset: 0, format: 'float32x4' },  // Position
                            { shaderLocation: 1, offset: 16, format: 'float32x4' }  // Color
                        ]
                    }]
                },
                fragment: {
                    module: shaderModule,
                    entryPoint: 'fs_main',
                    targets: [{ format: presentationFormat }]
                },
                primitive: {
                    topology: 'triangle-list',
                    cullMode: 'back', // Don't draw back-facing triangles
                },
                depthStencil: {
                    depthWriteEnabled: true,
                    depthCompare: 'less',
                    format: 'depth24plus'
                }
            });

            // 6. Create Vertex and Index Buffers
            const vertexBuffer = device.createBuffer({
                size: vertexData.byteLength,
                usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
            });
            device.queue.writeBuffer(vertexBuffer, 0, vertexData);

            const indexBuffer = device.createBuffer({
                size: indexData.byteLength,
                usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
            });
            device.queue.writeBuffer(indexBuffer, 0, indexData);

            // 7. Create Uniform Buffer for Matrices
            const uniformBufferSize = 4 * 16; // 4x4 matrix
            const uniformBuffer = device.createBuffer({
                size: uniformBufferSize,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });

            // 8. Create Bind Group
            const bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0),
                entries: [{
                    binding: 0,
                    resource: { buffer: uniformBuffer }
                }]
            });

            // Math Setup (gl-matrix)
            const { mat4, vec3 } = glMatrix;
            const modelViewProjectionMatrix = mat4.create();
            const viewMatrix = mat4.create();
            const projectionMatrix = mat4.create();
            
            // Camera position: x, y, z looking at 0, 0, 0
            mat4.lookAt(viewMatrix, [2, 2.5, 5], [0, 0, 0], [0, 1, 0]);

            let depthTexture = null;
            let rotationAngle = 0;

            // 9. Animation Loop
            function frame() {
                // Handle canvas resizing
                const devicePixelRatio = window.devicePixelRatio || 1;
                const newWidth = Math.max(1, canvas.clientWidth * devicePixelRatio);
                const newHeight = Math.max(1, canvas.clientHeight * devicePixelRatio);

                if (canvas.width !== newWidth || canvas.height !== newHeight || !depthTexture) {
                    canvas.width = newWidth;
                    canvas.height = newHeight;

                    // Recreate depth texture on resize
                    if (depthTexture) depthTexture.destroy();
                    depthTexture = device.createTexture({
                        size: [canvas.width, canvas.height],
                        format: 'depth24plus',
                        usage: GPUTextureUsage.RENDER_ATTACHMENT,
                    });
                }

                // Update Matrices
                rotationAngle += 0.01;
                const aspect = canvas.width / canvas.height;
                mat4.perspective(projectionMatrix, Math.PI / 4, aspect, 0.1, 100.0);

                const modelMatrix = mat4.create();
                mat4.rotate(modelMatrix, modelMatrix, rotationAngle, [1, 1, 0.5]); // Rotate on multiple axes

                // MVP = Projection * View * Model
                mat4.multiply(modelViewProjectionMatrix, viewMatrix, modelMatrix);
                mat4.multiply(modelViewProjectionMatrix, projectionMatrix, modelViewProjectionMatrix);

                // Write the new MVP matrix to the uniform buffer
                device.queue.writeBuffer(uniformBuffer, 0, modelViewProjectionMatrix);

                // Encode Render Commands
                const commandEncoder = device.createCommandEncoder();
                const renderPassDescriptor = {
                    colorAttachments: [{
                        view: context.getCurrentTexture().createView(),
                        clearValue: { r: 0.06, g: 0.09, b: 0.16, a: 1.0 }, // Tailwind slate-900 background
                        loadOp: 'clear',
                        storeOp: 'store',
                    }],
                    depthStencilAttachment: {
                        view: depthTexture.createView(),
                        depthClearValue: 1.0,
                        depthLoadOp: 'clear',
                        depthStoreOp: 'store',
                    }
                };

                const passEncoder = commandEncoder.beginRenderPass(renderPassDescriptor);
                passEncoder.setPipeline(pipeline);
                passEncoder.setBindGroup(0, bindGroup);
                passEncoder.setVertexBuffer(0, vertexBuffer);
                passEncoder.setIndexBuffer(indexBuffer, 'uint16');
                passEncoder.drawIndexed(indexData.length);
                passEncoder.end();

                // Submit to Queue
                device.queue.submit([commandEncoder.finish()]);

                requestAnimationFrame(frame);
            }

            requestAnimationFrame(frame);
        }

        // Run application
        window.onload = initWebGPU;
    </script>
</body>
</html>
